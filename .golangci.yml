version: "2"
run:
  timeout: 5m
  tests: true
linters:
  enable:
    - errorlint
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - prealloc
    - revive
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - hugeParam
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G404
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          disabled: false
        - name: unexported-return
          disabled: false
        - name: var-naming
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
        path: internal/infrastructure/postgres/creation_test\.go
        text: 'G101:'
      - linters:
          - gosec
        path: tests/e2e/scenarios_test\.go
        text: 'G704:'
      - linters:
          - errcheck
          - lll
        path: _test\.go
      - linters:
          - errcheck
        path: cmd/server/main\.go
        text: Error return value is not checked
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
